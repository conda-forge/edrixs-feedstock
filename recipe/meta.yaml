{% set name = "edrixs" %}
{% set version = "0.3.0.dev1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  url: https://github.com/EDRIXS/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ac1b0dd444a925dab5c4e2ca675a95431535cb349e676d1d8596e131822a5813
  patches:
    - cmake-python-development-module.patch

build:
  number: 0
  skip: true  # [win or py<310]

requirements:
  build:
    - make
    - cmake
    - {{ stdlib('c') }}
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - arpack * mpi_openmpi_*
    - libblas * *openblas
    - numpy >=2
    - openblas
    - openmpi
    - setuptools
    - wheel
    - ninja
  run:
    - python
    - libblas * *openblas
    - libopenblas
    - matplotlib-base
    - mpi4py
    - numba
    - numpy >=1.26
    - petsc * complex_*
    - slepc * complex_*
    - petsc4py
    - slepc4py
    - openblas
    - openmpi
    - scipy
    - sympy

test:
  imports:
    - edrixs
  files:
    - example_2_AIM_XAS.py
    - test_petsc_solver.py
  commands:
    - python test_petsc_solver.py
    - mpiexec -n 2 python test_petsc_solver.py
    - python example_2_AIM_XAS.py
    - mpiexec -n 2 python example_2_AIM_XAS.py

about:
  home: https://github.com/EDRIXS/edrixs
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: An open source toolkit for simulating RIXS spectra based on ED

extra:
  recipe-maintainers:
    - skarakuzu
    - lajerm
    - thopkins32
    - mpmdean
    - mrakitin
