{% set name = "edrixs" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  url: https://github.com/EDRIXS/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 8eaea21ba61927964daf4de52338220c0c1065fe9b8625087f7f15959adb66e2
  patches:
    - cmake-python-development-module.patch

build:
  number: 1
  skip: true  # [win]

requirements:
  build:
    - make
    - cmake
    - {{ stdlib('c') }}
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - arpack * mpi_openmpi_*
    - libblas * *openblas
    - numpy
    - openblas
    - openmpi
    - setuptools
  run:
    - python
    - libblas * *openblas
    - libopenblas
    - matplotlib-base
    - mpi4py
    - numba
    - numpy >=1.26
    - openblas
    - openmpi
    - scipy
    - sympy

test:
  imports:
    - edrixs
  files:
    - example_2_AIM_XAS.py
  commands:
    - python example_2_AIM_XAS.py
    - mpiexec -n 2 python example_2_AIM_XAS.py

about:
  home: https://github.com/EDRIXS/edrixs
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: An open source toolkit for simulating RIXS spectra based on ED

extra:
  recipe-maintainers:
    - skarakuzu
    - lajerm
    - thopkins32
    - mpmdean
    - mrakitin
